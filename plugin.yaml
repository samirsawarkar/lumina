name: lumina
version: "0.1.0"
description: "Ask Hermes about your Apple Photos library: find photos by person, place, scene or text in the image, and build albums. Reads Apple's on-device analysis via osxphotos. macOS only, no network."
author: "Samir Sawkar"
license: MIT
platforms: [macos]
requires_hermes: ">=0.23"
provides_tools:
  - lumina_search
  - lumina_create_album
  - lumina_library_info
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - transform_llm_output
  - pre_llm_call
python_dependencies:
  - "osxphotos>=0.70,<1"
  - "photoscript>=0.4,<1"
