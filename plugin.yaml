name: lumina
version: "0.1.0"
description: "Protects the private documents in your Apple Photos: a privacy check-up finds passports, cards and passwords, Safe Send makes verified redacted copies, and Leak Guard stops Hermes sending a raw ID off your Mac. Also searches photos by person, place, scene or text and makes albums and memory videos. macOS only, on-device."
author: "Samir Sawarkar"
license: MIT
platforms: [macos]
requires_hermes: ">=0.23"
provides_tools:
  - lumina_search
  - lumina_create_album
  - lumina_library_info
  - lumina_on_this_day
  - lumina_export
  - lumina_read_text
  - lumina_expiry
  - lumina_make_memory
  - lumina_redact
  - lumina_privacy_check
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - transform_llm_output
  - pre_llm_call
python_dependencies:
  - "osxphotos>=0.70,<1"
  - "photoscript>=0.4,<1"
  - "Pillow>=10,<14"
  - "pyobjc-framework-Vision>=10,<14"  # Safe Send text boxes; already pulled in by osxphotos
